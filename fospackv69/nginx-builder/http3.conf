# FOS-Streaming HTTP/3 Configuration
# Requires nginx compiled with HTTP/3 module (nginx-quic)

# Main context additions
events {
    use epoll;
    multi_accept on;
    worker_connections 10240;
}

http {
    # Enable HTTP/3
    http3 on;
    http3_max_concurrent_streams 128;
    http3_stream_buffer_size 128k;

    # Enable 0-RTT (Early Data)
    ssl_early_data on;

    # QUIC parameters
    quic_retry on;
    quic_gso on;
    quic_bpf on;

    # TLS 1.3 Configuration
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:P-256:P-384;

    # Session resumption for 0-RTT
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_session_ticket_key /etc/nginx/ssl/ticket.key;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HTTP/3 upstream for QUIC proxy
    upstream quic_backend {
        server 127.0.0.1:4433 quic;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # HTTP/3 server block
    server {
        # Listen on HTTPS with HTTP/3
        listen 443 quic reuseport;
        listen 443 ssl http2;

        server_name _;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Add Alt-Svc header to advertise HTTP/3
        add_header Alt-Svc 'h3=":443"; ma=86400, h3-29=":443"; ma=86400' always;

        # Add QUIC transport parameters
        add_header X-Quic-Version $http3_version always;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Enable ECH (Encrypted Client Hello)
        ssl_conf_command ECHEnabled on;
        ssl_conf_command ECHPublicName cloudflare.com;
        ssl_conf_command ECHKeyDir /etc/nginx/ech/;

        # Root location
        location / {
            root /home/fos-streaming/fos/www;
            try_files $uri $uri/ /index.php?$args;
        }

        # API endpoints with HTTP/3
        location /api/ {
            # Enable 0-RTT for API calls
            proxy_ssl_early_data on;

            # Pass to PHP-FPM
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP3 $http3;
            fastcgi_param QUIC_VERSION $http3_version;
            include fastcgi_params;
        }

        # QUIC streaming endpoint
        location /quic/ {
            # Proxy to QUIC backend
            proxy_pass https://quic_backend;
            proxy_http_version 3.0;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Alt-Used h3;

            # Enable 0-RTT
            proxy_ssl_early_data on;

            # Buffering settings for streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # WebSocket upgrade (for future use)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # HLS/DASH streaming with HTTP/3
        location /hls/ {
            alias /home/fos-streaming/fos/www1/;

            # CORS headers
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept" always;

            # Cache control
            add_header Cache-Control "no-cache" always;

            # HTTP/3 push for manifest files
            http3_push_preload on;
            http3_push /hls/playlist.m3u8;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
                application/dash+xml mpd;
                video/mp4 m4s;
            }
        }

        # WebTransport endpoint (experimental)
        location /webtransport {
            # WebTransport over HTTP/3
            webtransport_max_sessions 100;
            webtransport_session_timeout 300s;

            # Pass to application
            proxy_pass https://127.0.0.1:4434;
            proxy_http_version 3.0;
        }

        # QUIC statistics endpoint
        location /quic-stats {
            access_log off;

            # Return QUIC statistics
            return 200 "HTTP/3: $http3\nQUIC Version: $http3_version\nConnection ID: $quic_connection_id\n";
            add_header Content-Type text/plain;
        }

        # 0-RTT test endpoint
        location /0rtt-test {
            # Only allow with 0-RTT
            if ($ssl_early_data != "1") {
                return 425 "Too Early";
            }

            return 200 "0-RTT Success!";
            add_header Content-Type text/plain;
            add_header X-Early-Data $ssl_early_data always;
        }
    }

    # HTTP/3 load balancing
    upstream h3_pool {
        zone h3_zone 64k;

        # QUIC health check
        server 127.0.0.1:4433 quic max_conns=100 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4434 quic max_conns=100 max_fails=3 fail_timeout=30s backup;

        # Least connections load balancing
        least_conn;

        # Keep QUIC connections alive
        keepalive 32;
        keepalive_requests 1000;
        keepalive_time 1h;
        keepalive_timeout 60s;
    }

    # Logging for HTTP/3
    log_format quic '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'h3=$http3 quic=$quic_version early=$ssl_early_data '
                    'conn=$quic_connection_id';

    access_log /var/log/nginx/quic-access.log quic;

    # Enable QUIC BPF (eBPF for better performance)
    quic_bpf on;
}

# Stream context for UDP load balancing (QUIC)
stream {
    # UDP load balancer for QUIC
    upstream quic_lb {
        zone quic_zone 64k;
        server 127.0.0.1:4433 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:4434 max_fails=3 fail_timeout=30s;
    }

    # QUIC/UDP listener
    server {
        listen 443 udp reuseport;
        proxy_pass quic_lb;
        proxy_responses 0; # Expect no responses for UDP
        proxy_timeout 1s;
        proxy_buffer_size 64k;
    }
}
#############################################################################
# FOS-Streaming Nginx Streaming Service Configuration
# Auto-generated on 1764153982
#
# User: casapu:casapu
# Ports: 8001 (HTTP streaming), 1935 (RTMP ingest)
# Protocol: both
#############################################################################

user casapu casapu;
worker_processes auto;
worker_cpu_affinity auto;
worker_rlimit_nofile 1000000;
error_log /home/casapu/projects/FOS-Streaming-v69/fospackv69/fos/logs/nginx-streaming-error.log warn;
pid /tmp/fos-streaming-nginx.pid;

events {
    worker_connections 100000;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

http {
    include mime.types;
    default_type application/octet-stream;

    types {
        application/dash+xml mpd;
        video/mp4 m4s;
    }

    log_format streaming '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         'rt=$request_time';

    access_log /home/casapu/projects/FOS-Streaming-v69/fospackv69/fos/logs/nginx-streaming-access.log streaming buffer=256k flush=5m;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 60;
    client_header_timeout 60;
    send_timeout 60;
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    output_buffers 2 512k;
    chunked_transfer_encoding off;
    gzip off;
    server_tokens off;

    limit_conn_zone $binary_remote_addr zone=stream_conn:50m;
    limit_req_zone $binary_remote_addr zone=stream_req:50m rate=100r/s;

    upstream php_fpm_streaming {
        server unix:/home/casapu/projects/FOS-Streaming-v69/fospackv69/fos/php/php-fpm-streaming.socket;
        keepalive 128;
    }

    server {
        listen 8000 reuseport;
        listen [::]:8000 reuseport;
        server_name _;
        root /home/casapu/projects/FOS-Streaming-v69/public;
        index index.php;

        limit_conn stream_conn 50;
        limit_req zone=stream_req burst=200 nodelay;

        rewrite ^/live/(.*)/(.*)/(.*)$ /stream.php?username=$1&password=$2&stream=$3 break;
        rewrite ^/live/(.*)/(.*)/(.*)\.(m3u8|mpd|ts|m4s)$ /stream.php?username=$1&password=$2&stream=$3&format=$4 break;

        location /dash {
            alias /home/casapu/projects/FOS-Streaming-v69/fospackv69/fos/streams/dash;
            types {
                application/dash+xml mpd;
                video/mp4 m4s mp4;
                audio/mp4 m4a;
            }
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin * always;
            aio on;
            directio 512;
            sendfile on;
            access_log off;
        }

        location /hls {
            alias /home/casapu/projects/FOS-Streaming-v69/fospackv69/fos/streams/hls;
            default_type application/vnd.apple.mpegurl;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Access-Control-Allow-Origin * always;
            aio on;
            directio 512;
            sendfile on;
            access_log off;
        }

        # Route all requests through index.php (front controller pattern)
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php_fpm_streaming;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_keep_conn on;
            fastcgi_buffers 256 16k;
            fastcgi_hide_header X-Powered-By;
        }

        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        max_streams 128;
        ping 30s;
        ping_timeout 15s;
        drop_idle_publisher 30s;

        application live {
            live on;
            record off;
            gop_cache on;
            allow publish 127.0.0.1;
            allow publish ::1;
            deny publish all;
            allow play all;

            dash on;
            dash_path /home/casapu/projects/FOS-Streaming-v69/fospackv69/fos/streams/dash;
            dash_fragment 4s;
            dash_playlist_length 30s;
            dash_nested on;
            dash_cleanup on;
            hls on;
            hls_path /home/casapu/projects/FOS-Streaming-v69/fospackv69/fos/streams/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_nested on;
            hls_cleanup on;
        }
    }
}
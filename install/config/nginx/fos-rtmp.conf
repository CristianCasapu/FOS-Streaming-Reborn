# =============================================================================
# FOS-Streaming RTMP Server Configuration
# =============================================================================
# Purpose: RTMP stream ingestion and transcoding
# Port: 1935 (configurable via RTMP_PORT in .env)
#
# NOTE: This is an RTMP block configuration, NOT an HTTP server block.
#       It must be placed OUTSIDE the http {} block in nginx.conf
#
# REQUIRES: nginx compiled with nginx-http-flv-module
#
# PLACEHOLDERS (replaced by install script or manually):
#   __FOS_USER__    - System username (e.g., fosadmin)
#   __FOS_DIR__     - FOS-Streaming directory (e.g., /home/fosadmin/FOS-Streaming)
# =============================================================================

rtmp_auto_push on;
rtmp_auto_push_reconnect 1s;

rtmp {
    # =========================================================================
    # Server Configuration
    # =========================================================================
    server {
        listen 1935;
        chunk_size 4096;
        max_connections 1000;

        # Ping/pong for connection health
        ping 30s;
        ping_timeout 15s;

        # Drop idle publishers after 30 seconds
        drop_idle_publisher 30s;

        # =====================================================================
        # Live Streaming Application
        # =====================================================================
        application live {
            live on;
            record off;

            # GOP caching for faster player start
            gop_cache on;

            # Allow publishing from anywhere (restrict in production)
            # allow publish 127.0.0.1;
            # allow publish 10.0.0.0/8;
            # deny publish all;

            # Allow playback from anywhere
            allow play all;

            # -----------------------------------------------------------------
            # HLS Output Configuration
            # -----------------------------------------------------------------
            hls on;
            hls_path __FOS_DIR__/hl;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_cleanup on;
            hls_nested on;
            hls_continuous on;

            # Alternative HLS path (for fospackv69 structure)
            # hls_path __FOS_DIR__/fospackv69/fos/streams/hls;

            # HLS variant playlists for adaptive bitrate (optional)
            # hls_variant _low BANDWIDTH=500000;
            # hls_variant _mid BANDWIDTH=1500000;
            # hls_variant _high BANDWIDTH=4000000;

            # -----------------------------------------------------------------
            # DASH Output Configuration
            # -----------------------------------------------------------------
            dash on;
            dash_path __FOS_DIR__/fospackv69/fos/streams/dash;
            dash_fragment 4s;
            dash_playlist_length 30s;
            dash_nested on;
            dash_cleanup on;

            # -----------------------------------------------------------------
            # Authentication Callbacks
            # -----------------------------------------------------------------
            # Called when a stream starts publishing
            # on_publish http://127.0.0.1:8000/api/rtmp/on-publish;

            # Called when a stream stops publishing
            # on_publish_done http://127.0.0.1:8000/api/rtmp/on-publish-done;

            # Called when a client starts playing
            # on_play http://127.0.0.1:8000/api/rtmp/on-play;

            # Called when a client stops playing
            # on_play_done http://127.0.0.1:8000/api/rtmp/on-play-done;

            # -----------------------------------------------------------------
            # Recording (Optional)
            # -----------------------------------------------------------------
            # record all;
            # record_path __FOS_DIR__/recordings;
            # record_suffix -%Y%m%d-%H%M%S.flv;
            # record_unique on;
            # record_max_size 1024M;
            # record_notify on;
            # on_record_done http://127.0.0.1:8000/api/rtmp/on-record-done;

            # -----------------------------------------------------------------
            # Transcoding with FFmpeg (Optional)
            # -----------------------------------------------------------------
            # Transcode to multiple qualities
            # exec_push ffmpeg -i rtmp://localhost/live/$name
            #     -c:v libx264 -preset veryfast -b:v 3000k -maxrate 3000k -bufsize 6000k
            #     -c:a aac -b:a 128k -f flv rtmp://localhost/hls/$name_high
            #     -c:v libx264 -preset veryfast -b:v 1500k -maxrate 1500k -bufsize 3000k
            #     -c:a aac -b:a 128k -f flv rtmp://localhost/hls/$name_mid
            #     -c:v libx264 -preset veryfast -b:v 500k -maxrate 500k -bufsize 1000k
            #     -c:a aac -b:a 64k -f flv rtmp://localhost/hls/$name_low;
        }

        # =====================================================================
        # HLS Output Application (for transcoded streams)
        # =====================================================================
        application hls {
            live on;
            record off;

            hls on;
            hls_path __FOS_DIR__/hl;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_cleanup on;
            hls_nested on;

            # Only allow local publishing (from transcoder)
            allow publish 127.0.0.1;
            deny publish all;
            allow play all;
        }

        # =====================================================================
        # Encoder Input Application
        # =====================================================================
        # Separate application for encoder input with relay to main app
        application encoder {
            live on;
            record off;

            # Push incoming streams to the live application
            push rtmp://127.0.0.1/live;

            # Allow publishing from encoders only
            # allow publish 10.0.0.0/8;
            # deny publish all;
        }

        # =====================================================================
        # Restream Application (Optional)
        # =====================================================================
        # For pushing streams to external services
        application restream {
            live on;
            record off;

            # Example: Push to YouTube
            # push rtmp://a.rtmp.youtube.com/live2/YOUR-STREAM-KEY;

            # Example: Push to Twitch
            # push rtmp://live.twitch.tv/app/YOUR-STREAM-KEY;

            # Example: Push to Facebook
            # push rtmps://live-api-s.facebook.com:443/rtmp/YOUR-STREAM-KEY;
        }
    }
}

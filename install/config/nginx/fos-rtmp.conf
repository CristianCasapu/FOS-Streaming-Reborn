# =============================================================================
# FOS-Streaming RTMP Server Configuration
# =============================================================================
# Purpose: Handles RTMP stream ingestion and HLS output generation
# Port: 1935 (RTMP), 8080 (HTTP for HLS playback)
# 
# PLACEHOLDERS (replaced by install script):
#   __FOS_USER__    - System username (e.g., fosadmin)
#   __FOS_DIR__     - FOS-Streaming directory (e.g., /home/fosadmin/FOS-Streaming)
# =============================================================================

rtmp {
    server {
        # RTMP listening port
        listen 1935;
        chunk_size 4096;

        # Application for live streams
        application live {
            # Enable live streaming
            live on;

            # Record streams (optional - for archive functionality)
            # record all;
            # record_path __FOS_DIR__/storage/recordings;
            # record_unique on;

            # HLS (HTTP Live Streaming) output
            # This generates HLS segments for HTTP-FLV playback
            hls on;
            hls_path __FOS_DIR__/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            hls_continuous on;
            hls_cleanup on;
            hls_nested on;

            # HLS variants for adaptive bitrate streaming (optional)
            # hls_variant _low BANDWIDTH=256000;
            # hls_variant _mid BANDWIDTH=512000;
            # hls_variant _high BANDWIDTH=1024000;

            # Allow all origins for HLS playback
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range, Accept, Content-Type' always;

            # On Publish Event - Stream Authentication
            # This runs when a streamer starts publishing
            on_publish http://localhost:8080/rtmp/auth;
            on_publish_done http://localhost:8080/rtmp/done;

            # On Play Event - Viewer Authentication
            # This runs when a viewer starts playing
            on_play http://localhost:8080/rtmp/play;
            on_play_done http://localhost:8080/rtmp/play_done;

            # Stream callbacks for logging and monitoring
            on_record_done http://localhost:8080/rtmp/record_done;

            # Security: Restrict publishing to authorized users only
            # Uncomment and configure authentication as needed
            # allow publish all;
            # allow play all;

            # Drop connections that are idle for too long
            idle_streams off;
        }

        # Application for VOD (Video on Demand)
        application vod {
            play_local_path __FOS_DIR__/storage/vod;
            play on;

            # CORS headers for VOD playback
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        # Statistics and monitoring
        application stats {
            play on;
            
            # Allow only local access to stats
            allow play 127.0.0.1;
            allow play 10.0.0.0/8;
            allow play 172.16.0.0/12;
            allow play 192.168.0.0/16;
            deny play all;
        }
    }
}

# =============================================================================
# HTTP Server for HLS Playback
# =============================================================================
# Serves HLS segments generated by RTMP server
server {
    listen 8080;
    server_name localhost;

    # Location for HLS files
    location /hls {
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
        }

        # CORS headers for all HLS requests
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Accept, Content-Type' always;
        add_header 'Accept-Ranges' 'bytes' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Security: Add security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Cache HLS playlists and segments
        add_header Cache-Control "public, max-age=10" always;
        add_header Vary "User-Agent, Accept" always;

        # Enable compression for playlists
        gzip on;
        gzip_types text/plain application/vnd.apple.mpegurl;
        gzip_min_length 256;

        # Root directory for HLS files
        root __FOS_DIR__;
        
        # Disable access logging for better performance
        access_log off;
        error_log __FOS_DIR__/logs/nginx-hls-error.log warn;
    }

    # Block direct access to other directories
    location / {
        deny all;
        return 403;
    }
}


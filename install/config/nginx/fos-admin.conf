# =============================================================================
# FOS-Streaming Admin Web UI - Nginx Virtual Host
# =============================================================================
# Purpose: Serves the admin dashboard, API, and subscriber portal
# Port: 8000 (configurable via WEB_PORT in .env)
# PHP-FPM Pool: fos-admin (optimized for web requests)
#
# PLACEHOLDERS (replaced by install script or manually):
#   __FOS_USER__    - System username (e.g., fosadmin)
#   __FOS_DIR__     - FOS-Streaming directory (e.g., /home/fosadmin/FOS-Streaming)
#   __PHP_VERSION__ - PHP version (e.g., 8.4)
# =============================================================================

upstream php-fpm-admin {
    server unix:/run/php/php__PHP_VERSION__-fpm-admin.sock;
    keepalive 32;
}

server {
    # =========================================================================
    # Listen Configuration
    # =========================================================================
    listen 8000;
    listen [::]:8000;
    server_name _;

    # For HTTPS (uncomment and configure certificates):
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    # ssl_session_timeout 1d;
    # ssl_session_cache shared:SSL:50m;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;

    # =========================================================================
    # Document Root
    # =========================================================================
    root __FOS_DIR__/public;
    index index.php index.html;

    # =========================================================================
    # Logging
    # =========================================================================
    access_log __FOS_DIR__/logs/admin-access.log;
    error_log __FOS_DIR__/logs/admin-error.log;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # For HTTPS only:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # =========================================================================
    # Request Limits
    # =========================================================================
    client_max_body_size 100M;          # Max upload size
    client_body_timeout 120s;            # Request body timeout
    client_header_timeout 120s;          # Request header timeout

    # =========================================================================
    # Security - Deny Access to Sensitive Files
    # =========================================================================
    location ~ /\.(ht|git|env|gitignore) {
        deny all;
        return 404;
    }

    location ~ ^/(vendor|storage|bootstrap/cache|node_modules)/ {
        deny all;
        return 404;
    }

    location ~ ^/\.well-known/ {
        allow all;
    }

    # =========================================================================
    # Static Assets - Aggressive Caching
    # =========================================================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Vite/Build assets
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # =========================================================================
    # PHP Processing - Admin Pool
    # =========================================================================
    location ~ \.php$ {
        # Security: Only allow existing PHP files
        try_files $uri =404;

        # FastCGI configuration
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm-admin;
        fastcgi_index index.php;

        # FastCGI parameters
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS off;  # Set to 'on' for HTTPS

        # Timeouts - longer for admin operations
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # Buffers - sized for admin dashboard responses
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Keep connections alive
        fastcgi_keep_conn on;
    }

    # =========================================================================
    # Application Routes
    # =========================================================================
    # NOTE: Admin path is configurable via ADMIN_PATH in .env (default: /admin)
    # The index.php front controller handles routing dynamically based on .env
    # Do NOT add hardcoded /admin locations - let PHP handle all routing

    # Main application entry point - handles ALL dynamic routes
    # This includes: admin panel, subscriber portal, API endpoints
    # The index.php reads ADMIN_PATH from .env and routes accordingly
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =========================================================================
    # Health Check Endpoint
    # =========================================================================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # Nginx Status (for monitoring)
    # =========================================================================
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # =========================================================================
    # Deny access to backup files
    # =========================================================================
    location ~* \.(sql|bak|backup|old|orig|tmp|swp)$ {
        deny all;
        return 404;
    }
}


# =============================================================================
# FOS-Streaming Admin Server - Nginx Virtual Host Configuration
# =============================================================================
# Purpose: Serves admin dashboard, API endpoints, and subscriber portal
# Port: 8000
# PHP-FPM Pool: fos-admin (/run/php/php__PHP_VERSION__-fpm-admin.sock)
#
# PLACEHOLDERS (replaced by install script):
#   __FOS_USER__    - System username (e.g., fosadmin)
#   __FOS_DIR__     - FOS-Streaming directory (e.g., /home/fosadmin/FOS-Streaming)
#   __PHP_VERSION__ - PHP version (e.g., 8.4)
# =============================================================================

server {
    listen 8000;
    server_name localhost;

    # Document root
    root __FOS_DIR__/public;
    index index.php index.html;

    # =============================================================================
    # Security Headers
    # =============================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' wss: ws:;" always;

    # =============================================================================
    # Request Limits & Timeouts
    # =============================================================================
    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    client_body_timeout 60s;
    send_timeout 60s;

    # =============================================================================
    # Logging Configuration
    # =============================================================================
    access_log __FOS_DIR__/logs/nginx-admin-access.log main;
    error_log __FOS_DIR__/logs/nginx-admin-error.log warn;

    # =============================================================================
    # Rate Limiting
    # =============================================================================
    limit_req zone=api_limit burst=20 nodelay;
    limit_req zone=login_limit burst=5 nodelay;
    limit_conn conn_limit 20;

    # =============================================================================
    # PHP-FPM Configuration (Admin Pool)
    # =============================================================================
    location ~ \.php$ {
        try_files $uri =404;
        
        # Connect to admin PHP-FPM pool
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-admin.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Admin-specific timeouts
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;

        # Buffer settings for admin operations
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 256k;
    }

    # =============================================================================
    # CORS Headers for API Endpoints
    # =============================================================================
    location /api/ {
        # Add CORS headers for API requests
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Pass to PHP
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =============================================================================
    # Block Direct Access to Stream Files
    # =============================================================================
    location /hls/ {
        deny all;
        return 403;
    }

    location /dash/ {
        deny all;
        return 403;
    }

    # Block access to stream thumbnails and segments
    location ~ ^/(hl|chunks|segments)/ {
        deny all;
        return 403;
    }

    # =============================================================================
    # Static Assets
    # =============================================================================
    location /build/ {
        alias __FOS_DIR__/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        
        # Compression for static assets
        gzip_static on;
    }

    # Static assets in public directory
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    # =============================================================================
    # Main Application Routing
    # =============================================================================
    # Dynamic routing - allows ADMIN_PATH from .env to work
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =============================================================================
    # Health Check & Status Endpoints
    # =============================================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # PHP-FPM status page for admin pool
    location /fpm-status-admin {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-admin.sock;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        include fastcgi_params;
    }

    # =============================================================================
    # Security - Hide Sensitive Files
    # =============================================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to version control
    location ~ ^/\.(git|svn|hg) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup and temp files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =============================================================================
    # Error Pages
    # =============================================================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root __FOS_DIR__/public/errors;
        internal;
    }
    
    location = /50x.html {
        root __FOS_DIR__/public/errors;
        internal;
    }
}

# =============================================================================
# FOS-Streaming Service - Nginx Virtual Host
# =============================================================================
# Purpose: Serves HLS/HTTP-FLV streams to subscribers
# Port: 8080 (configurable via STREAMING_PORT in .env)
# PHP-FPM Pool: fos-streaming (optimized for stream authentication)
#
# NOTE: This configuration requires nginx compiled with:
#   - nginx-http-flv-module (for HTTP-FLV and RTMP)
#   - Use the FOS custom nginx build from fospackv69/
#
# PLACEHOLDERS (replaced by install script or manually):
#   __FOS_USER__    - System username (e.g., fosadmin)
#   __FOS_DIR__     - FOS-Streaming directory (e.g., /home/fosadmin/FOS-Streaming)
#   __PHP_VERSION__ - PHP version (e.g., 8.4)
# =============================================================================

upstream php-fpm-streaming {
    server unix:/run/php/php__PHP_VERSION__-fpm-streaming.sock;
    keepalive 64;
}

server {
    # =========================================================================
    # Listen Configuration
    # =========================================================================
    listen 8080;
    listen [::]:8080;
    server_name _;

    # =========================================================================
    # Logging - Minimal for Performance
    # =========================================================================
    access_log __FOS_DIR__/logs/streaming-access.log combined buffer=512k flush=1m;
    error_log __FOS_DIR__/logs/streaming-error.log warn;

    # =========================================================================
    # Performance Optimizations for Streaming
    # =========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio on;
    directio 512;

    # Disable buffering for live streams
    proxy_buffering off;

    # =========================================================================
    # Security Headers (minimal for streaming performance)
    # =========================================================================
    add_header X-Content-Type-Options "nosniff" always;

    # =========================================================================
    # CORS Headers for Stream Playback
    # =========================================================================
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, Origin, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    # =========================================================================
    # HLS Streaming - Main Stream Delivery
    # =========================================================================
    location /hls {
        alias __FOS_DIR__/hl;

        # MIME types for HLS
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        # No caching for live streams
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # CORS for player compatibility
        add_header Access-Control-Allow-Origin * always;

        # Optional: Token-based authentication
        # Uncomment to enable stream authentication via PHP
        # location ~ \.m3u8$ {
        #     rewrite ^/hls/(.*)$ /stream-auth.php?stream=$1 last;
        # }
    }

    # Alternative HLS path (fospackv69/fos/streams/hls)
    location /streams/hls {
        alias __FOS_DIR__/fospackv69/fos/streams/hls;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin * always;
    }

    # =========================================================================
    # DASH Streaming
    # =========================================================================
    location /dash {
        alias __FOS_DIR__/fospackv69/fos/streams/dash;

        types {
            application/dash+xml mpd;
            video/mp4 m4s mp4;
            audio/mp4 m4a;
        }

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin * always;
    }

    # =========================================================================
    # HTTP-FLV Streaming (Requires nginx-http-flv-module)
    # =========================================================================
    location /live {
        flv_live on;
        chunked_transfer_encoding on;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Credentials true always;

        # No caching
        add_header Cache-Control "no-cache";
    }

    # =========================================================================
    # Stream Statistics - JSON Format
    # =========================================================================
    location /stat {
        rtmp_stat all;
        rtmp_stat_format json;

        # Restrict access (optional - uncomment to limit)
        # allow 127.0.0.1;
        # allow 10.0.0.0/8;
        # deny all;
    }

    # =========================================================================
    # Stream Statistics - XML Format
    # =========================================================================
    location /stat.xml {
        rtmp_stat all;

        # Restrict access (optional)
        # allow 127.0.0.1;
        # deny all;
    }

    # =========================================================================
    # Stream Control Interface
    # =========================================================================
    location /control {
        rtmp_control all;

        # IMPORTANT: Restrict access to localhost only
        allow 127.0.0.1;
        deny all;
    }

    # =========================================================================
    # Stream Authentication Endpoint (PHP)
    # =========================================================================
    location ~ ^/stream-auth\.php$ {
        root __FOS_DIR__/public;

        fastcgi_pass php-fpm-streaming;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Short timeouts for auth requests
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 10s;
        fastcgi_read_timeout 10s;
    }

    # =========================================================================
    # Player Assets (if serving player from streaming port)
    # =========================================================================
    location /player {
        alias __FOS_DIR__/public/player;

        expires 1d;
        add_header Cache-Control "public";

        location ~* \.(js|css)$ {
            expires 7d;
        }
    }

    # =========================================================================
    # Thumbnail/Preview Images
    # =========================================================================
    location /thumbnails {
        alias __FOS_DIR__/storage/thumbnails;

        expires 1m;
        add_header Cache-Control "public, max-age=60";
    }

    # =========================================================================
    # Health Check
    # =========================================================================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # =========================================================================
    # Nginx Status
    # =========================================================================
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # =========================================================================
    # Deny All Other Requests
    # =========================================================================
    location / {
        return 404;
    }
}

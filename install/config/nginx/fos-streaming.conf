# =============================================================================
# FOS-Streaming Service Server - Nginx Virtual Host Configuration
# =============================================================================
# Purpose: Handles stream authentication, playlist generation, and token validation
# Port: 8080
# PHP-FPM Pool: fos-streaming (/run/php/php__PHP_VERSION__-fpm-streaming.sock)
# Optimized for: High concurrency, low latency, minimal memory per request
#
# PLACEHOLDERS (replaced by install script):
#   __FOS_USER__    - System username (e.g., fosadmin)
#   __FOS_DIR__     - FOS-Streaming directory (e.g., /home/fosadmin/FOS-Streaming)
#   __PHP_VERSION__ - PHP version (e.g., 8.4)
# =============================================================================

server {
    listen 8080;
    server_name localhost;

    # Document root (not used for streaming, but required)
    root __FOS_DIR__/public;
    index index.php;

    # =============================================================================
    # Performance Optimizations for Streaming
    # =============================================================================
    # Disable access logging for better performance (optional)
    access_log __FOS_DIR__/logs/nginx-streaming-access.log streaming;
    error_log __FOS_DIR__/logs/nginx-streaming-error.log warn;

    # Minimal timeout values for faster response
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 5s;
    keepalive_timeout 5s;
    keepalive_requests 100;

    # Smaller buffers for streaming endpoints
    client_body_buffer_size 8k;
    client_header_buffer_size 1k;

    # =============================================================================
    # Rate Limiting (More Permissive for Streaming)
    # =============================================================================
    # Higher limits for streaming endpoints
    limit_req zone=api_limit burst=100 nodelay;
    limit_conn conn_limit 100;

    # =============================================================================
    # PHP-FPM Configuration (Streaming Pool)
    # =============================================================================
    location ~ \.php$ {
        try_files $uri =404;
        
        # Connect to streaming PHP-FPM pool
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-streaming.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Streaming-specific timeouts (shorter for performance)
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;

        # Minimal buffer settings for speed
        fastcgi_buffer_size 4k;
        fastcgi_buffers 4 4k;
        fastcgi_busy_buffers_size 8k;
        fastcgi_temp_file_write_size 8k;

        # Disable buffering for streaming requests
        fastcgi_buffering off;
        fastcgi_request_buffering off;
    }

    # =============================================================================
    # Stream Authentication Endpoints
    # =============================================================================
    # Token validation and stream authentication
    location ~ ^/(token|auth|validate)/ {
        # CORS headers for player compatibility
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Minimal caching for auth endpoints
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        try_files $uri $uri/ /index.php?$query_string;
    }

    # =============================================================================
    # Playlist and Stream Info Endpoints
    # =============================================================================
    # M3U8 playlists and stream information
    location ~ ^/(playlist|stream|info)/ {
        # CORS headers for media players
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Accept, Content-Type' always;

        # Cache playlists briefly (30 seconds)
        add_header Cache-Control "public, max-age=30";
        add_header Vary "User-Agent, Accept";

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Compression for playlists
        gzip on;
        gzip_types text/plain application/vnd.apple.mpegurl;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # =============================================================================
    # HLS Segment Proxy (Protected Access)
    # =============================================================================
    # Proxy access to HLS segments through PHP authentication
    location ~ ^/hls/(.+)$ {
        # No direct file access - must go through PHP
        try_files $uri /index.php?$query_string;
        
        # Add CORS headers for video players
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Accept, Content-Type' always;
        add_header 'Accept-Ranges' 'bytes' always;

        # Cache segments aggressively (1 hour)
        add_header Cache-Control "public, max-age=3600";
        add_header Vary "User-Agent, Accept";
        
        # Compression for text-based segments
        gzip on;
        gzip_types text/plain application/octet-stream;
    }

    # =============================================================================
    # DASH Segment Proxy (Protected Access)
    # =============================================================================
    # Proxy access to DASH segments through PHP authentication
    location ~ ^/dash/(.+)$ {
        # No direct file access - must go through PHP
        try_files $uri /index.php?$query_string;
        
        # Add CORS headers for video players
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Range, Accept, Content-Type' always;
        add_header 'Accept-Ranges' 'bytes' always;

        # Cache segments aggressively (1 hour)
        add_header Cache-Control "public, max-age=3600";
        add_header Vary "User-Agent, Accept";
    }

    # =============================================================================
    # Stats and Monitoring Endpoints
    # =============================================================================
    location /stats {
        access_log off;
        # Only allow local access
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =============================================================================
    # Health Check Endpoint
    # =============================================================================
    location /health {
        access_log off;
        return 200 "streaming-healthy\n";
        add_header Content-Type text/plain;
    }

    # PHP-FPM status page for streaming pool
    location /fpm-status-streaming {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        fastcgi_pass unix:/run/php/php__PHP_VERSION__-fpm-streaming.sock;
        fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
        include fastcgi_params;
    }

    # =============================================================================
    # Block Direct Access to Stream Storage
    # =============================================================================
    # Explicitly deny access to stream storage directories
    location ~ ^/(hl|chunks|segments|storage|streams)/ {
        deny all;
        return 403;
    }

    # =============================================================================
    # Minimal Security Headers
    # =============================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # =============================================================================
    # Main Routing for Streaming Endpoints
    # =============================================================================
    # Catch-all for streaming PHP endpoints
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =============================================================================
    # Error Handling
    # =============================================================================
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root __FOS_DIR__/public/errors;
        internal;
    }
    
    location = /50x.html {
        root __FOS_DIR__/public/errors;
        internal;
    }
}

# =============================================================================
# FOS-Streaming - Main Nginx Configuration
# =============================================================================
# This is the main nginx.conf for the FOS custom nginx build.
# It includes separate vhost files for admin and streaming services.
#
# Location: ~/FOS-Streaming/fospackv69/fos/nginx/conf/nginx.conf
#
# PLACEHOLDERS (replaced by install script or manually):
#   __FOS_USER__    - System username (e.g., fosadmin)
#   __FOS_DIR__     - FOS-Streaming directory (e.g., /home/fosadmin/FOS-Streaming)
# =============================================================================

# Run as the FOS user
user __FOS_USER__ __FOS_USER__;

# Automatic worker processes based on CPU cores
worker_processes auto;
worker_cpu_affinity auto;

# Process ID file
pid __FOS_DIR__/fospackv69/fos/nginx/logs/nginx.pid;

# Error log
error_log __FOS_DIR__/logs/nginx-error.log warn;

# Worker limits
worker_rlimit_nofile 65535;

# =============================================================================
# Events Configuration
# =============================================================================
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

# =============================================================================
# HTTP Configuration
# =============================================================================
http {
    # =========================================================================
    # Basic Settings
    # =========================================================================
    include       mime.types;
    default_type  application/octet-stream;

    # Hide nginx version
    server_tokens off;

    # Character encoding
    charset utf-8;

    # =========================================================================
    # Logging Configuration
    # =========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format streaming '$remote_addr [$time_local] "$request" '
                         '$status $body_bytes_sent '
                         'rt=$request_time';

    # Default access log
    access_log __FOS_DIR__/logs/nginx-access.log main;

    # =========================================================================
    # Performance Optimizations
    # =========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Timeouts
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 60s;
    reset_timedout_connection on;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 100M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Hash sizes
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # =========================================================================
    # Open File Cache
    # =========================================================================
    open_file_cache max=10000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # =========================================================================
    # Rate Limiting Zones
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =========================================================================
    # Include Virtual Host Configurations
    # =========================================================================

    # Admin Web UI (port 8000)
    include __FOS_DIR__/install/config/nginx/fos-admin.conf;

    # Streaming Service (port 8080)
    include __FOS_DIR__/install/config/nginx/fos-streaming.conf;
}

# =============================================================================
# RTMP Configuration
# =============================================================================
# Include RTMP server configuration (port 1935)
include __FOS_DIR__/install/config/nginx/fos-rtmp.conf;

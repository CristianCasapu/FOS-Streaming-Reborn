; =============================================================================
; FOS-Streaming Admin Pool - PHP-FPM Configuration
; =============================================================================
; Purpose: Handles admin dashboard, API requests, and subscriber portal
; Socket: /run/php/php8.4-fpm-admin.sock
; Optimized for: Web UI responsiveness, form processing, API calls
;
; Installation:
;   sudo cp install/config/php-fpm/fos-admin.conf /etc/php/8.4/fpm/pool.d/
;   sudo systemctl restart php8.4-fpm
; =============================================================================

[fos-admin]

; =============================================================================
; Process User/Group
; =============================================================================
; UPDATE to match your FOS user
user = fosadmin
group = fosadmin

; =============================================================================
; Socket Configuration
; =============================================================================
listen = /run/php/php8.4-fpm-admin.sock
listen.owner = fosadmin
listen.group = fosadmin
listen.mode = 0660

; Listen backlog (increase for high traffic)
listen.backlog = 511

; =============================================================================
; Process Manager Configuration
; =============================================================================
; dynamic: Spawns workers based on demand (recommended for web UI)
; static: Fixed number of workers
; ondemand: Spawns workers only when needed (lower memory, slower response)
pm = dynamic

; Maximum number of child processes
; Formula: Total RAM / 50MB per process (adjust based on your server)
; 4GB RAM: ~80 | 8GB RAM: ~160 | 16GB RAM: ~320
pm.max_children = 50

; Starting number of workers when FPM starts
pm.start_servers = 10

; Minimum idle workers to maintain
pm.min_spare_servers = 5

; Maximum idle workers to maintain
pm.max_spare_servers = 35

; Number of requests before a worker is respawned (prevents memory leaks)
pm.max_requests = 500

; How long an idle process lives before being killed
pm.process_idle_timeout = 10s

; =============================================================================
; Request Configuration
; =============================================================================
; Maximum execution time (matches php.ini max_execution_time)
request_terminate_timeout = 300s

; Log slow requests (for debugging performance issues)
request_slowlog_timeout = 10s
slowlog = /var/log/php8.4-fpm-admin-slow.log

; =============================================================================
; PHP Settings - Admin Optimized
; =============================================================================
; Memory limit (admin operations may need more)
php_admin_value[memory_limit] = 256M

; Upload limits
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 100M

; Execution time limits
php_admin_value[max_execution_time] = 300
php_admin_value[max_input_time] = 300

; Session configuration
php_admin_value[session.save_handler] = files
php_admin_value[session.save_path] = /home/fosadmin/FOS-Streaming/storage/framework/sessions
php_admin_value[session.gc_maxlifetime] = 7200
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = "Lax"
php_admin_value[session.use_strict_mode] = 1
php_admin_value[session.use_only_cookies] = 1

; Error logging
php_admin_value[error_log] = /home/fosadmin/FOS-Streaming/logs/php-admin-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Security settings
php_admin_value[expose_php] = off
php_admin_value[cgi.fix_pathinfo] = 0

; OPcache settings (complement php.ini settings)
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.revalidate_freq] = 0

; Timezone (UPDATE to match your server timezone)
php_admin_value[date.timezone] = UTC

; =============================================================================
; Logging Configuration
; =============================================================================
; Catch worker output (useful for debugging)
catch_workers_output = yes
decorate_workers_output = no

; Access log format
access.log = /home/fosadmin/FOS-Streaming/logs/php-admin-access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

; =============================================================================
; Environment Variables
; =============================================================================
; Clear all environment variables before setting
clear_env = no

; Pass environment variables
env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp
env[FOS_POOL] = admin

; =============================================================================
; Security Limits
; =============================================================================
; Only allow .php extensions
security.limit_extensions = .php

; Chroot (optional - uncomment for additional security)
; chroot = /home/fosadmin/FOS-Streaming
; chdir = /public

; =============================================================================
; Status Page (for monitoring)
; =============================================================================
; Enable FPM status page
pm.status_path = /fpm-status-admin
pm.status_listen = 127.0.0.1:9001

; Ping path for health checks
ping.path = /fpm-ping-admin
ping.response = pong-admin

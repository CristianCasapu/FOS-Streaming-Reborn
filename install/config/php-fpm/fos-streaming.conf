; =============================================================================
; FOS-Streaming Service Pool - PHP-FPM Configuration
; =============================================================================
; Purpose: Handles stream authentication, playlist generation, token validation
; Socket: /run/php/php__PHP_VERSION__-fpm-streaming.sock
; Optimized for: High concurrency, low latency, minimal memory per request
;
; Installation:
;   sudo cp install/config/php-fpm/fos-streaming.conf /etc/php/__PHP_VERSION__/fpm/pool.d/
;   sudo systemctl restart php__PHP_VERSION__-fpm
;
; PLACEHOLDERS (replaced by install script or manually):
;   __FOS_USER__    - System username (e.g., fosadmin)
;   __FOS_DIR__     - FOS-Streaming directory (e.g., /home/fosadmin/FOS-Streaming)
;   __PHP_VERSION__ - PHP version (e.g., 8.4)
; =============================================================================

[fos-streaming]

; =============================================================================
; Process User/Group
; =============================================================================
user = __FOS_USER__
group = __FOS_USER__

; =============================================================================
; Socket Configuration
; =============================================================================
listen = /run/php/php__PHP_VERSION__-fpm-streaming.sock
listen.owner = __FOS_USER__
listen.group = __FOS_USER__
listen.mode = 0660

; Higher backlog for high-concurrency streaming auth
listen.backlog = 1024

; =============================================================================
; Process Manager Configuration
; =============================================================================
; static: Fixed number of workers (best for predictable streaming load)
; Use dynamic if load varies significantly
pm = static

; Maximum number of child processes
; Streaming requests are fast and light, can handle more concurrent
; Formula: Expected concurrent viewers / 10
pm.max_children = 100

; For dynamic mode (uncomment if using pm = dynamic):
; pm.start_servers = 20
; pm.min_spare_servers = 10
; pm.max_spare_servers = 50

; Respawn workers after N requests (lower for streaming to free memory faster)
pm.max_requests = 1000

; Idle timeout (for dynamic mode)
pm.process_idle_timeout = 5s

; =============================================================================
; Request Configuration - Optimized for Speed
; =============================================================================
; Stream auth should be fast - shorter timeout
request_terminate_timeout = 30s

; Log slow requests (anything over 1s for auth is a problem)
request_slowlog_timeout = 1s
slowlog = /var/log/php__PHP_VERSION__-fpm-streaming-slow.log

; =============================================================================
; PHP Settings - Streaming Optimized
; =============================================================================
; Lower memory limit (auth requests are simple)
php_admin_value[memory_limit] = 64M

; No file uploads in streaming context
php_admin_value[upload_max_filesize] = 1M
php_admin_value[post_max_size] = 1M
php_admin_value[file_uploads] = 0

; Short execution time (auth must be fast)
php_admin_value[max_execution_time] = 30
php_admin_value[max_input_time] = 30

; Session - use Redis for shared state across workers
; Uncomment if using Redis for sessions:
; php_admin_value[session.save_handler] = redis
; php_admin_value[session.save_path] = "tcp://127.0.0.1:6379?auth=YOUR_REDIS_PASSWORD"

; File-based sessions (simpler setup)
php_admin_value[session.save_handler] = files
php_admin_value[session.save_path] = __FOS_DIR__/storage/framework/sessions
php_admin_value[session.gc_maxlifetime] = 3600

; Minimal session security settings
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1

; Error logging (minimal for performance)
php_admin_value[error_log] = __FOS_DIR__/logs/php-streaming-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[error_reporting] = E_ERROR | E_WARNING | E_PARSE

; Security settings
php_admin_value[expose_php] = off
php_admin_value[cgi.fix_pathinfo] = 0

; OPcache - aggressive caching for streaming scripts
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.memory_consumption] = 64
php_admin_value[opcache.interned_strings_buffer] = 8
php_admin_value[opcache.max_accelerated_files] = 4000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.revalidate_freq] = 0
php_admin_value[opcache.fast_shutdown] = 1

; Disable unnecessary features for performance
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600

; Timezone
php_admin_value[date.timezone] = UTC

; =============================================================================
; Logging Configuration - Minimal for Performance
; =============================================================================
catch_workers_output = yes
decorate_workers_output = no

; Access log (consider disabling in production for performance)
access.log = __FOS_DIR__/logs/php-streaming-access.log
access.format = "%{mili}d %s %m %r"

; =============================================================================
; Environment Variables
; =============================================================================
clear_env = no

env[HOSTNAME] = $HOSTNAME
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMP] = /tmp
env[TMPDIR] = /tmp
env[TEMP] = /tmp
env[FOS_POOL] = streaming

; =============================================================================
; Security Limits
; =============================================================================
security.limit_extensions = .php

; =============================================================================
; Status Page (for monitoring)
; =============================================================================
pm.status_path = /fpm-status-streaming
pm.status_listen = 127.0.0.1:9002

ping.path = /fpm-ping-streaming
ping.response = pong-streaming

; =============================================================================
; Resource Limits (Optional - uncomment if needed)
; =============================================================================
; rlimit_files = 65535
; rlimit_core = unlimited

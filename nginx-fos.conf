# FOS Streaming Nginx Configuration
# Copy to /etc/nginx/sites-available/fos and symlink to sites-enabled

server {
    listen 8000;
    server_name localhost;

    root /home/casapu/projects/FOS-Streaming-v69/public;
    index index.php index.html;

    # Increase timeouts for streaming
    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # Logging
    access_log /var/log/nginx/fos-access.log;
    error_log /var/log/nginx/fos-error.log;

    # Handle PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # CORS headers for API
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Block direct access to HLS/DASH streams - must go through PHP auth
    location /hls/ {
        deny all;
        return 403;
    }

    location /dash/ {
        deny all;
        return 403;
    }

    # Static assets
    location /build/ {
        alias /home/casapu/projects/FOS-Streaming-v69/public/build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Main routing - let PHP handle all routing logic
    # This allows dynamic ADMIN_PATH from .env to work
    location / {
        try_files $uri /index.php?$query_string;
    }
}

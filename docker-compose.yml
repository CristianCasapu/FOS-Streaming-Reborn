version: '3.8'

services:
  fos-streaming:
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
    image: sail-8.4/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-7777}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
      - '${STREAMING_PORT:-8000}:8000'
      - '${RTMP_PORT:-1935}:1935'
    environment:
      WWWUSER: '${WWWUSER:-1000}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
    networks:
      - fos-network
    depends_on:
      - mariadb
      - redis
      - mailpit

  mariadb:
    image: 'mariadb:11.4'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-fosstreaming}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-fos_streaming}'
      MYSQL_USER: '${DB_USERNAME:-fos}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-fosstreaming}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - 'fos-mariadb:/var/lib/mysql'
      - './install/create_streaming_db.sql:/docker-entrypoint-initdb.d/10-create_streaming_db.sql'
    networks:
      - fos-network
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD:-fosstreaming}'
      retries: 3
      timeout: 5s

  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'fos-redis:/data'
    networks:
      - fos-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - fos-network

  nginx:
    build:
      context: ./fospackv69/nginx-builder
      dockerfile: Dockerfile
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - '.:/var/www/html'
      - './fospackv69/nginx-builder/nginx.conf:/etc/nginx/nginx.conf'
    networks:
      - fos-network
    depends_on:
      - fos-streaming

networks:
  fos-network:
    driver: bridge

volumes:
  fos-mariadb:
    driver: local
  fos-redis:
    driver: local
